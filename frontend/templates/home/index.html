{% extends "base.html" %}

{% block title %}
Movies
{% endblock  %}

{% block content %}

<h1>Now Showing</h1>

<div class="movie-grid">

    {% for movie in movies %}

    <div class="movie-card">

        <img src="{{ movie.poster_url }}" width="200">

        <h3>{{ movie.title }}</h3>

        <p>{{ movie.genre }}</p>

        <p>{{ movie.language }}</p>

        <p>{{ movie.rating }}</p>

        <a href="{% url 'movie_shows' movie.id %}" class="btn">
            Book Tickets
        </a>
    </div>

    {% empty %}

    <p>No movies available.</p>
    
    {% endfor %}
    
</div>

{% endblock  %}
