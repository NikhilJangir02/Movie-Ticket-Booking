{% extends "base.html" %}

{% block title %}
Change Password
{% endblock  %}

{% block body_class %}
no-scroll
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <div class="form-header">

            <h2>Change Password</h2>
            <p>Keep your account secure</p>

        </div>
        
        {% if error %}

        <div class="error-box">
            {{ error }}
        </div>

        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="input-box1">
                <label>New Password</label>
                <input type="password" name="new_password" required>
            </div>

            <button class="save-btn">
                Change Password
            </button>

            <a href="{% url 'profile' %}" class="cancel-btn">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock  %}
