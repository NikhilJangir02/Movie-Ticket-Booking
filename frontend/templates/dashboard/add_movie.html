{% extends "base.html" %}

{% block title %}
Add Movie
{% endblock  %}

{% block content %}

<div class="form-card1">

    <div class="form-header1">
        <h1>Add New Movie</h1>
        <p>Fill in the details below to add a new movie.</p>
    </div>

    {% if error %}
    <div class="error-box1">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" class="movie-form1">

        {% csrf_token %}

        <div class="form-group1">

            <label>Movie Title</label>
            <input type="text" name="title" required>
        </div>

        <div class="form-group1">
            <label>Description</label>
            <textarea name="description" rows="5"></textarea>
        </div>

        <div class="form-row1">

            <div class="form-group1">
                <label>Genre</label>
                <input type="text" name="genre" required>
            </div>

            <div class="form-group1">
                <label>Language</label>
                <input type="text" name="language" required>
            </div>

        </div>

        <div class="form-row1">

            <div class="form-group1">

            <label>Duration (minutes)</label>
            <input type="number" name="duration" required>

            </div>

            <div class="form-group1">
                <label>Release Year</label>
                <input type="number" name="release_year" required>
            </div>

        </div>

        <div class="form-row1">

            <div class="form-group1">
                <label>Rating</label>
                <input type="number" step="0.1" name="rating" required>
            </div>

            <div class="form-group1">
                <label>Poster URL</label>
                <input type="url" name="poster_url" required>
            </div>

        </div>

        <button class="submit-btn1">
            ➕ Add Movie
        </button>

    </form>

</div>

{% endblock  %}
