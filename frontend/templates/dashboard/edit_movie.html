{% extends "base.html" %}

{% block title %}
Edit Movie
{% endblock  %}

{% block content %}

<div class="edit-movie-page">

    <div class="edit-movie-card">

        <div class="edit-header">

            <h1>🎬 Edit Movie</h1>

        </div>

        {% if error %}
        <div class="error-form">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="edit-movie-form">

            {% csrf_token %}

            <div class="form-grid">

                <div class="input-group">

                    <label>Movie Title</label>
                    <input type="text" name="title" value="{{ movie.title }}" required>

                </div>

                <div class="input-group">
                    <label>Genre</label>
                    <input type="text" name="genre" value="{{ movie.genre }}" required>

                </div>

                <div class="input-group">
                    <label>Language</label>
                    <input type="text" name="language" ="{{ movie.language }}" required>

                </div>

                <div class="input-group">
                    <label>Duration (Minutes)</label>
                    <input type="number" name="duration" value="{{ movie.duration }}" required>

                </div>
                <div class="input-group">
                    <label>Release Year</label>
                    <input type="number" name="release_year" value="{{ movie.release_year }}" required>

                </div>

                <div class="input-group">
                    <label>Rating</label>
                    <input type="number" step="0.1" name="rating" value="{{ movie.rating }}" required>

                </div>

            </div>

            <div class="input-group">
                    <label>Description</label>
                    <textarea name="description" rows="6">{{ movie.description }}</textarea>
               </div>

               <div class="input-group">
                <label>Poster URL</label>
                <input type="url" name="poster_url" value="{{ movie.poster_url }}" required>

               </div>

               <button type="submit" class="update-btn">
                💾 Update Movie
               </button>
        </form>

    </div>
    
</div>

{% endblock  %}
